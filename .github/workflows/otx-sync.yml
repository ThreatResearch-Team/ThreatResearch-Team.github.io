name: Create OTX Pulses from Indicator Batch

on:
  workflow_dispatch:

jobs:
  create-otx-pulses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install OTXv2

      - name: Create OTX pulses
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: python .github/scripts/otx_sync.py
